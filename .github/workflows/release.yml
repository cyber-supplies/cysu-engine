# Release: build the engine and worker images and publish them to GitHub
# Container Registry (ghcr.io/<org>/cysu-engine and .../cysu-engine-workspace),
# for linux/amd64, tagged <version> and latest.
#
# Triggered by a person, never automatically:
#   - push a version tag:      git tag v0.1.0 && git push origin v0.1.0
#   - or on GitHub: Actions → "Release images" → Run workflow (enter the version)
# The version must match package.json. See docs/RELEASING.md.
#
# Uses the repository's built-in GITHUB_TOKEN; no secrets to set up.

name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (must match package.json)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: v
        env:
          # Passed through env (not pasted into the script) so odd input
          # cannot change the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$v' is not a version like 0.1.0"; exit 1
          fi
          p=$(node -p "require('./package.json').version")
          if [ "$v" != "$p" ]; then
            echo "::error::Version $v does not match package.json ($p). Update package.json first."; exit 1
          fi
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/$owner/cysu-engine-workspace" >> "$GITHUB_OUTPUT"
          echo "engine=ghcr.io/$owner/cysu-engine" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Worker image (Node, Go, Python, ProjectDiscovery, cysu, Codex, Claude Code)
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.v.outputs.worker }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.worker }}:latest

      - name: Engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            WORKER_IMAGE=${{ steps.v.outputs.worker }}:${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.engine }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.engine }}:latest

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.v.outputs.version }}"
            echo "- \`${{ steps.v.outputs.engine }}:${{ steps.v.outputs.version }}\`"
            echo "- \`${{ steps.v.outputs.worker }}:${{ steps.v.outputs.version }}\`"
            echo
            echo "First release? An org admin must make both packages **public** once (package → Package settings → Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
